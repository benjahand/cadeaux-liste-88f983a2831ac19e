<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Liste de cadeaux</title>
    <script src="js/accueil.js" type="module"></script>
</head>
<body>
    <header class="entete">
        <h1>🎁 Liste de cadeaux</h1>
        <p>Qui es-tu ?</p>
    </header>

    <main class="contenu">
        <section>
            <ul class="liste-roles">
                <li><button class="btn btn-famille" data-role="Maman">Maman</button></li>
                <li><button class="btn btn-famille" data-role="Papa">Papa</button></li>
                <li><button class="btn btn-famille" data-role="Soeur-ainee">Marilou</button></li>
                <li><button class="btn btn-famille" data-role="Soeur-cadette">Elisa</button></li>
                <li><button class="btn btn-famille" data-role="Copine">Margot</button></li>
            </ul>
        </section>

        <section class="zone-createur">
            <button class="btn btn-createur" data-role="Createur">Créateur</button>
        </section>

        <form id="form-createur" hidden>
            <label for="email">E-mail</label>
            <input id="email" type="email" autocomplete="username" required>
            <label for="mdp">Mot de passe</label>
            <input id="mdp" type="password" autocomplete="current-password" required>
            <button class="btn btn-createur" type="submit">Se connecter</button>
            <p id="erreur" role="alert"></p>
        </form>
    </main>
</body>
</html>
